
<div class="manutencao-container">

  <h1>Manutenção de Produtos</h1>

  <h2>
    @if (produtoId) {
      Alterar produto
    } @else {
      Cadastrar produto
    }
  </h2>

  <form>

    @if (produtoId) {

      <label for="id">ID</label>
      <input
        id="id"
        name="id"
        type="text"
        [ngModel]="produto.id"
        disabled
      >

    }

    <label for="nome">Nome</label>
    <input
      id="nome"
      name="nome"
      type="text"
      placeholder="Digite o nome do produto"
      [(ngModel)]="produto.nome"
    >

    <label for="categoria">Categoria</label>
    <input
      id="categoria"
      name="categoria"
      type="text"
      placeholder="Digite a categoria"
      [(ngModel)]="produto.categoria"
    >

    <label for="descricao">Descrição</label>
    <textarea
      id="descricao"
      name="descricao"
      placeholder="Digite a descrição"
      [(ngModel)]="produto.descricao"
    ></textarea>

    <label for="preco">Preço</label>
    <input
      id="preco"
      name="preco"
      type="number"
      [(ngModel)]="produto.preco"
    >

    <label for="cor">Cor</label>
    <input
      id="cor"
      name="cor"
      type="text"
      placeholder="Ex.: #d71920"
      [(ngModel)]="produto.cor"
    >

    <button
      type="button"
      (click)="salvar()"
    >
      @if (produtoId) {
        Salvar alteração
      } @else {
        Cadastrar
      }
    </button>

  </form>

</div>
