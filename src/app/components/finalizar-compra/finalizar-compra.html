<div class="finalizar-container">

  <h1>Finalizar compra</h1>

  <p>Você já possui cadastro?</p>

  <div class="opcoes">

    <button type="button" (click)="irParaLogin()">
      Já sou cadastrado
    </button>

    <button type="button" (click)="irParaCadastro()">
      Não sou cadastrado
    </button>

  </div>

  @if (clienteLogado) {

    <div class="confirmacao">

      <h2>Compra pronta para finalizar</h2>

      <p>
        Você está logado. Clique abaixo para confirmar sua compra.
      </p>

      <button type="button" (click)="confirmarCompra()">
        Confirmar compra
      </button>

    </div>

  }

</div>
