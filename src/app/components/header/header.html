<header class="header">
  <div class="container header-content">

    <a routerLink="/" class="logo">
      <span class="logo-mark">🏁</span>
      <span>F1 <strong>&</strong> SCALE</span>
    </a>

    <nav class="nav">

      <a routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Início
      </a>

      <a routerLink="/produtos" routerLinkActive="active">
        Modelos
      </a>

      <a *ngIf="isAdmin()" routerLink="/admin-produtos-listar" routerLinkActive="active">
        Manutenção
      </a>

      <a *ngIf="isAdmin()" routerLink="/admin-clientes-listar" routerLinkActive="active">
        Clientes
      </a>

      <a routerLink="/carrinho" routerLinkActive="active" class="cart-link">
        Carrinho
        <span class="cart-badge">{{ carrinhoService.quantidade() }}</span>
      </a>

      <a *ngIf="estaLogado()" routerLink="/" (click)="sair()">
        Sair
      </a>

      <a *ngIf="!estaLogado()" routerLink="/login" routerLinkActive="active">
        Login
      </a>

    </nav>

  </div>
</header>
