<div class="manutencao-container">

  <h1>Manutenção de Clientes</h1>

  <h2>Cadastrar cliente</h2>

 <form>

  <div class="campo">
    <label for="nome">Nome</label>
    <input
      id="nome"
      name="nome"
      type="text"
      placeholder="Digite o nome"
      [(ngModel)]="nome">
  </div>

  <div class="campo">
    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="Digite o e-mail"
      [(ngModel)]="email">
  </div>

  <div class="campo">
    <label for="senha">Senha</label>
    <input
      id="senha"
      name="senha"
      type="password"
      placeholder="Digite a senha"
      [(ngModel)]="senha">
  </div>

  <button type="button" (click)="cadastrarCliente()">
    @if (clienteEditando) {
      Salvar alteração
    } @else {
      Cadastrar
    }
  </button>

</form>

  <h2>Clientes cadastrados</h2>

  @for (cliente of clientes; track cliente.email) {

    <div class="cliente">

      <p><strong>Nome:</strong> {{ cliente.nome }}</p>

      <p><strong>E-mail:</strong> {{ cliente.email }}</p>

      <button
        type="button"
        (click)="editarCliente(cliente)">
        Alterar
      </button>

      <button
        type="button"
        (click)="excluirCliente(cliente)">
        Excluir
      </button>

    </div>

  }

</div>
