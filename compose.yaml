services:

  instalar:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm install

  api:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npx json-server backend/db.json --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      instalar:
        condition: service_completed_successfully

  site:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NG_CLI_ANALYTICS: "false"
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    ports:
      - "4200:4200"
    depends_on:
      instalar:
        condition: service_completed_successfully

volumes:
  node_modules:
